slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: true
    mode: mapping

    resolution: 0.05
    max_laser_range: 11.5
    minimum_time_interval: 0.5
    minimum_travel_distance: 0.12
    minimum_travel_heading: 0.12
    map_update_interval: 2.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 11.5
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.0
    loop_search_maximum_distance: 5.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_coarse: 2.0
    loop_match_minimum_response_coarse: 0.4
    loop_match_minimum_response_fine: 0.5

    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.008
    correlation_search_space_smear_deviation: 0.06
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.04
    loop_search_space_smear_deviation: 0.02
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.7
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
