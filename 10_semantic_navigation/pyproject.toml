[project]
name = "semantic-navigation-simulation"
version = "0.1.0"
description = "Semantic navigation simulation in a living-room Gazebo world with ROS-MCP access."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
authors = [
    { name = "Bharat Jain" }
]

dependencies = [
    "cbor2>=5.6.5",
    "fastmcp>=2.11.3",
    "jsonschema>=4.25.1",
    "mcp[cli]>=1.13.0",
    "opencv-python>=4.11.0.86",
    "pillow>=11.3.0",
    "websocket-client>=1.8.0",
    "pymongo",
    "tornado",
    "netifaces",
]
