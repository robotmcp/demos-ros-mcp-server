# ROS2 Control configuration for Go2 robot
# This file configures the joint controllers for quadruped locomotion

controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    
    # Joint trajectory controller for all legs
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      ros__parameters:
        joints:
          - FL_hip_joint
          - FL_thigh_joint
          - FL_calf_joint
          - FR_hip_joint
          - FR_thigh_joint
          - FR_calf_joint
          - RL_hip_joint
          - RL_thigh_joint
          - RL_calf_joint
          - RR_hip_joint
          - RR_thigh_joint
          - RR_calf_joint
        command_interfaces:
          - position
          - velocity
        state_interfaces:
          - position
          - velocity
        allow_partial_joints_goal: true
        open_loop_control: true
        allow_integration_in_goal_time: true
        constraints:
          stopped_velocity_tolerance: 0.05
          goal_time: 0.0
          FL_hip_joint: {trajectory: 0.1}
          FL_thigh_joint: {trajectory: 0.1}
          FL_calf_joint: {trajectory: 0.1}
          FR_hip_joint: {trajectory: 0.1}
          FR_thigh_joint: {trajectory: 0.1}
          FR_calf_joint: {trajectory: 0.1}
          RL_hip_joint: {trajectory: 0.1}
          RL_thigh_joint: {trajectory: 0.1}
          RL_calf_joint: {trajectory: 0.1}
          RR_hip_joint: {trajectory: 0.1}
          RR_thigh_joint: {trajectory: 0.1}
          RR_calf_joint: {trajectory: 0.1}

    # Individual joint controllers
    fl_hip_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: FL_hip_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    fl_thigh_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: FL_thigh_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    fl_calf_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: FL_calf_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    fr_hip_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: FR_hip_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    fr_thigh_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: FR_thigh_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    fr_calf_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: FR_calf_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    rl_hip_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: RL_hip_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    rl_thigh_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: RL_thigh_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    rl_calf_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: RL_calf_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    rr_hip_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: RR_hip_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    rr_thigh_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: RR_thigh_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}

    rr_calf_position_controller:
      type: position_controllers/JointPositionController
      ros__parameters:
        joint: RR_calf_joint
        pid: {p: 100.0, i: 0.0, d: 10.0}
